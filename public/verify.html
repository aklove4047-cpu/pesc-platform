        const parts = path.split('/').filter(Boolean);

        }

      rawToken = (rawToken || '').trim();

              <button class="btn gold" style="font-weight:800; padding:10px 20px;">Verify Now</button>
            </form>
          </div>
        `;
        return;
      }

      const token = encodeURIComponent(rawToken);
      let d;

      if (path.includes('/marksheet/')) {
        d = await api('/api/public/verify/marksheet/' + token).catch(() => null);
      } else if (path.includes('/coordinator/')) {
        d = await api('/api/public/verify/coordinator/' + token).catch(() => null);

    function getCourseCurriculumSubjects(courseNameOrCode, evalPattern, termName) {
      const norm = String(courseNameOrCode || '').toUpperCase();
      const pattern = (evalPattern === 'semester') ? 'semester' : 'yearly';
      const term = String(termName || (pattern === 'semester' ? 'Semester 1' : 'Annual Examination')).trim();

      let key = Object.keys(COURSE_CURRICULUM_DATA).find(k => norm === k || norm.includes(k) || (COURSE_CURRICULUM_DATA[k].name && norm.includes(COURSE_CURRICULUM_DATA[k].name.toUpperCase())));
      if (!key) {
        if (norm.includes('NURSERY') || norm.includes('NTT') || norm.includes('TEACHER')) key = 'NTT';
        else if (norm.includes('ADVANCED') || norm.includes('ADCA')) key = 'ADCA';
        else if (norm.includes('DCA')) key = 'DCA';
        else if (norm.includes('TALLY')) key = 'TALLY';
        else if (norm.includes('CCC')) key = 'CCC';
        else if (norm.includes('PGDCA')) key = 'PGDCA';
        else if (norm.includes('DTP') || norm.includes('PUBLISHING')) key = 'DTP';
        else if (norm.includes('HARDWARE') || norm.includes('NETWORKING')) key = 'HARDWARE';
        else if (norm.includes('YOGA')) key = 'YOGA';
        else if (norm.includes('FASHION')) key = 'FASHION';
      }

      if (key && COURSE_CURRICULUM_DATA[key]) {
        const courseObj = COURSE_CURRICULUM_DATA[key];
        const patObj = courseObj[pattern] || {};

        if (patObj[term]) return patObj[term];

        if (pattern === 'semester') {
          if (term.includes('2') || term.toLowerCase().includes('second')) return patObj['Semester 2'] || Object.values(patObj)[1] || patObj['Semester 1'];
          if (term.includes('3') || term.toLowerCase().includes('third')) return patObj['Semester 3'] || Object.values(patObj)[2] || patObj['Semester 1'];
          if (term.includes('4') || term.toLowerCase().includes('fourth')) return patObj['Semester 4'] || Object.values(patObj)[3] || patObj['Semester 1'];
          return patObj['Semester 1'] || Object.values(patObj)[0];
        } else {
          if (term.includes('2nd') || term.toLowerCase().includes('second')) return patObj['2nd Year'] || patObj['Annual Examination'];
          if (term.includes('Final') || term.toLowerCase().includes('final')) return patObj['Final Year'] || patObj['2nd Year'] || patObj['Annual Examination'];
          if (term.includes('1st') || term.toLowerCase().includes('first')) return patObj['1st Year'] || patObj['Annual Examination'];
          return patObj['Annual Examination'] || Object.values(patObj)[0];
        }
      }

      const cLabel = courseNameOrCode || 'Vocational';
      if (pattern === 'semester') {
        const semNum = term.match(/\d+/) ? term.match(/\d+/)[0] : '1';
        return [
          { code: `SEM${semNum}-01`, name: `${cLabel} Theory & Fundamentals (Sem-${semNum})`, max_marks: 100, theory: 45, practical: 45 },
          { code: `SEM${semNum}-02`, name: `${cLabel} Systems, Tools & Methodology (Sem-${semNum})`, max_marks: 100, theory: 44, practical: 46 },
          { code: `SEM${semNum}-03`, name: `${cLabel} Applied Practical Workshop - ${semNum}`, max_marks: 100, theory: 46, practical: 45 },
          { code: `SEM${semNum}-04`, name: `${cLabel} Term Assessment & Viva-Voce (Sem-${semNum})`, max_marks: 100, theory: 47, practical: 47 },
        ];
      } else {
        const yearLabel = term.includes('1') ? 'Year 1' : term.includes('2') ? 'Year 2' : 'Annual';
        return [
          { code: `Y-${yearLabel}-01`, name: `${cLabel} Core Foundations & Theory (${yearLabel})`, max_marks: 100, theory: 45, practical: 45 },

            <!-- Subject Assessment Table -->
            ${(function() {
              let subs = d.subjects || [];
              if (typeof subs === 'string') {
                try { subs = JSON.parse(subs); } catch(e) { subs = []; }
              }
              if (!subs || !subs.length) {
                subs = getCourseCurriculumSubjects(d.course || d.course_code, d.evaluation_type, d.term);
              }
              if (!subs || !subs.length) return '';
              return `
                <div style="margin: 10px 0 14px;">
                  <table style="width:100%; border-collapse:collapse; font-size:0.82rem;">
                    <thead>
                      <tr style="background:#f1f5f9; text-align:left;">
                        <th style="padding:6px 8px; border:1px solid #cbd5e1; width:75px;">Code</th>
                        <th style="padding:6px 8px; border:1px solid #cbd5e1;">Subject Name (विषय)</th>
                        <th style="padding:6px 8px; border:1px solid #cbd5e1; text-align:center; width:55px;">Max</th>
                        <th style="padding:6px 8px; border:1px solid #cbd5e1; text-align:center; width:55px;">Obt</th>
                        <th style="padding:6px 8px; border:1px solid #cbd5e1; text-align:center; width:55px;">Grade</th>
                      </tr>
                    </thead>
                    <tbody>
                      ${subs.map((s, idx) => {
                        const sMax = s.total_max || s.max_marks || 100;
                        const sObt = s.total_obt !== undefined ? s.total_obt : (s.obt_theory || 44) + (s.obt_practical || 44);
                        const sGrd = sObt >= sMax * 0.85 ? 'A+' : sObt >= sMax * 0.75 ? 'A' : sObt >= sMax * 0.6 ? 'B' : 'C';
                        return `
                          <tr style="background:${idx % 2 === 0 ? '#fff' : '#f8fafc'};">
                            <td style="padding:5px 8px; border:1px solid #cbd5e1; font-family:monospace; font-weight:700; color:#0a2a5e;">${esc(s.code || `SUB${idx+1}`)}</td>
                            <td style="padding:5px 8px; border:1px solid #cbd5e1; font-weight:600;">${esc(s.name || s)}</td>
                            <td style="padding:5px 8px; border:1px solid #cbd5e1; text-align:center;">${sMax}</td>
                            <td style="padding:5px 8px; border:1px solid #cbd5e1; text-align:center; font-weight:700; color:#0f172a;">${sObt}</td>
                            <td style="padding:5px 8px; border:1px solid #cbd5e1; text-align:center; font-weight:800; color:#16a34a;">${sGrd}</td>
                          </tr>
                        `;
                      }).join('')}
                    </tbody>
                  </table>
                </div>
              `;
            })()}

            <div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:10px; padding:14px; display:flex; justify-content:space-around; text-align:center; margin-bottom:14px;">
              <div>
                <span class="muted" style="font-size:0.75rem;">TOTAL SCORE</span>
                <p style="font-weight:700; font-size:1.15rem; color:var(--navy); margin:2px 0 0;">${d.total_obtained} / ${d.total_max}</p>
              </div>
              <div>
                <span class="muted" style="font-size:0.75rem;">PERCENTAGE</span>
                <p style="font-weight:700; font-size:1.15rem; color:var(--navy); margin:2px 0 0;">${d.percentage}%</p>
              </div>
              <div>
                <span class="muted" style="font-size:0.75rem;">GRADE</span>
                <p style="font-weight:700; font-size:1.15rem; color:var(--navy); margin:2px 0 0;">${esc(d.grade)}</p>
              </div>
              <div>
                <span class="muted" style="font-size:0.75rem;">RESULT</span>
                <p style="margin:2px 0 0;">${badge(d.result)}</p>
              </div>
            </div>

            ${renderOfficialCouncilFooter({
              directorName: directorName,
              centreCode: cCode
            })}

            <div style="margin-top:14px; font-size:0.8rem; color:#16a34a; font-weight:700; text-align:center;">
              ✅ Cryptographically validated via Purvanchal Education &amp; Skill Council Official Central Ledger.
            </div>
            <div style="margin-top:14px; text-align:center;">
              <button class="btn sm alt" onclick="window.print()">🖨️ Print Official Verification Slip</button>
            </div>
          </div>
        `;
      } else {
        $('#r').innerHTML = `
          <div class="verify-result-box" style="text-align:left; background:#ffffff; border:10px double #d4af37; padding:26px 28px; border-radius:12px; box-shadow:0 8px 30px rgba(0,0,0,0.06); position:relative;">
            <div class="verify-seal-watermark">PESC</div>

            ${renderOfficialCouncilHeader({
              studentCode: d.student_code || d.roll_no || 'PESC-26-00008',
              rollNo: d.roll_no || d.student_code || 'PESC-00008',
              refNo: d.certificate_no || 'PESC-CERT-2026-0007',
              issueDate: d.issued_on || '04-10-2026'
            })}

            <!-- Certificate Title Ribbon & Student Photo -->
            <div style="position:relative; margin:10px 0 16px;">
              <!-- Student Photo on Right -->
              <div style="position:absolute; right:10px; top:0; width:76px; height:92px; border:2px solid #0a2a5e; border-radius:4px; overflow:hidden; background:#f8fafc; box-shadow:0 2px 6px rgba(0,0,0,0.15); display:flex; align-items:center; justify-content:center;">
                ${directorPhotoHtml}
              </div>

              <!-- Centered Ribbon Title -->
              <div style="text-align:center; max-width:440px; margin:0 auto; padding-right:50px;">
                <div style="display:inline-block; background:linear-gradient(135deg, #065f46, #047857); color:#ffffff; font-size:1.55rem; font-weight:900; letter-spacing:3px; padding:6px 40px; border-radius:6px; box-shadow:0 3px 8px rgba(4,120,87,0.3); border:2px solid #d4af37;">
                  CERTIFICATE
                </div>
                <div style="font-size:0.75rem; font-weight:800; color:#064e3b; letter-spacing:1px; margin-top:4px;">
                  COURSE COMPLETION &amp; SKILL CERTIFICATION
                </div>
              </div>
            </div>

            <!-- Official Certificate Body Text -->
            <div style="font-size:0.92rem; color:#000000; font-weight:700; line-height:2.2; text-align:center; margin:18px auto 14px; max-width:740px;">
              THIS IS TO CERTIFY THAT MR. / MRS. <span style="font-size:1.28rem; font-weight:900; color:#0a2a5e; border-bottom:1.5px solid #64748b; padding:0 10px;">${esc(d.holder)}</span><br>
              STUDENT REGISTRATION CODE <span style="font-family:monospace; font-weight:900; color:#0a2a5e; border-bottom:1.5px solid #64748b; padding:0 8px;">${esc(d.student_code || d.roll_no)}</span> HAS SUCCESSFULLY CLEARED THE<br>
              ASSESSMENT IN THE JOB ROLE / COURSE <span style="font-size:1.2rem; font-weight:900; color:#064e3b; border-bottom:1.5px solid #64748b; padding:0 8px;">"${esc(d.course)}"</span><br>
              WITH GRADE <span style="font-size:1.15rem; font-weight:900; color:#16a34a; border-bottom:1.5px solid #64748b; padding:0 8px;">A+ (EXEMPLARY)</span> FROM OUR AUTHORIZED STUDY CENTRE<br>
              <div style="font-size:1.28rem; font-weight:900; color:#0a2a5e; margin:6px 0; letter-spacing:0.5px;">${esc(cName)} (${esc(cCode)})</div>
              HE / SHE HAS BEEN AWARDED WITH THE OFFICIAL CERTIFICATE / DIPLOMA OF SAID JOB ROLE.<br>
              STATUS: <span style="color:#16a34a; font-weight:900;">${esc(d.status).toUpperCase()} VERIFIED</span> · CERTIFICATE NO: <span style="font-family:monospace; font-weight:900;">${esc(d.certificate_no)}</span>
            </div>

            ${renderOfficialCouncilFooter({
              directorName: directorName,
              centreCode: cCode
            })}

            <div style="margin-top:14px; font-size:0.8rem; color:#16a34a; font-weight:700; text-align:center;">
              ✅ Cryptographically validated on ${esc(d.issued_on || new Date().toLocaleDateString('en-IN'))} via Purvanchal Education &amp; Skill Council Central Registry.
            </div>
            <div style="margin-top:14px; text-align:center;">
              <button class="btn sm alt" onclick="window.print()">🖨️ Print Official Verification Slip</button>
            </div>
          </div>
        `;
      }
    });
  </script>
</body>
</html>
