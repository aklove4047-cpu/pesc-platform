<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Official Document Verification – PESC Council</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <nav class="nav">
    <a href="/" class="brand">
      <div class="brand-logo">P</div>
      <div class="brand-text">
        <b>PESC Council</b>
        <span>National Verification Portal</span>
      </div>
    </a>
    <div class="nav-links">
      <a href="/">Council Home</a>
      <a href="/login" class="btn-cta" style="padding:6px 14px; font-size:0.82rem;">Sign In</a>
    </div>
  </nav>

  <main style="max-width:700px;">
    <section class="card">
      <div style="text-align:center; margin-bottom:20px;">
        <span class="hero-pill" style="color:#0a2a5e; border-color:#d4af37; background:#fef3c7;">
          🛡️ PESC OFFICIAL VERIFICATION SYSTEM
        </span>
        <h2 style="margin-top:8px;">Online Document Validation</h2>
        <p class="muted">Instant digital authenticity verification for credentials issued by Purvanchal Education &amp; Skill Council</p>
      </div>

      <div id="r" style="text-align:center; padding:30px 10px;">
        <div style="font-size:2rem; margin-bottom:8px;">🔍</div>
        <p class="muted">Checking council digital records and cryptographic seal…</p>
      </div>
    </section>
  </main>

  <script src="/assets/js/app.js"></script>
  <script>
    guard(async () => {
      const path = location.pathname;
      const token = encodeURIComponent(path.split('/').pop());
      let d;

      if (path.includes('/marksheet/')) {
        d = await api('/api/public/verify/marksheet/' + token);
      } else {
        d = await api('/api/public/verify/' + token);
      }

      if (!d || d.status === 'Not Found') {
        $('#r').innerHTML = `
          <div style="padding:20px; background:#fef2f2; border:1px solid #fecaca; border-radius:12px;">
            <div style="font-size:3rem; margin-bottom:8px;">❌</div>
            <h3 style="color:#b91c1c;">Invalid or Record Not Found</h3>
            <p class="muted">The requested document token or identifier was not found in the council's database. Please check the token or contact the issuing authority.</p>
          </div>
        `;
        return;
      }

      const cName = d.institute_name || d.centre || 'Authorized Training Centre';
      const cCode = d.centre_code || 'PESC00001';
      const cAddress = d.institute_address || 'City Campus, Main Road';
      const directorName = d.director_name || 'Dr. Ramesh Kumar';
      const directorPhoto = d.director_photo || '';
      const validityText = d.validity || 'Lifetime Recognition / Session 2026-27';

      const directorPhotoHtml = directorPhoto
        ? `<img src="${esc(directorPhoto)}" alt="Director Photo" style="width:100%; height:100%; object-fit:cover;">`
        : `<div style="text-align:center; padding:2px;"><div style="font-size:1.4rem;">👤</div><span style="font-size:0.5rem; font-weight:700; color:#64748b; display:block; line-height:1;">Director Photo</span></div>`;

      if (d.type === 'Marksheet') {
        $('#r').innerHTML = `
          <div class="verify-result-box" style="text-align:left; background:#ffffff; border:10px double #d4af37; padding:26px 28px; border-radius:12px; box-shadow:0 8px 30px rgba(0,0,0,0.06); position:relative;">
            <div class="verify-seal-watermark">PESC</div>

            <!-- Top Accreditations & Run By Bar -->
            <div style="border-bottom:2px solid #b45309; padding-bottom:8px; margin-bottom:12px; text-align:center;">
              <div style="font-size:0.92rem; font-weight:800; color:#b45309; letter-spacing:0.8px; text-transform:uppercase;">
                Run by: Purvanchal Shiksha Parishad (पूर्वांचल शिक्षा परिषद द्वारा संचालित)
              </div>
              <div style="font-size:0.72rem; color:#334155; font-weight:600; line-height:1.4; margin-top:3px; max-width:820px; margin-left:auto; margin-right:auto;">
                Register - Ministry of Micro, Small and Medium Enterprises of India (MSME) · Govt. of NCT Delhi · Niti Aayog Recognized · ISO with IAF · ISO 9001:2015 Certified
              </div>
            </div>

            <!-- Institute & Director Top Header Row -->
            <div style="display:flex; justify-content:space-between; align-items:flex-start; border-bottom:1.5px solid #d4af37; padding-bottom:10px; margin-bottom:14px; gap:12px; text-align:left;">
              <div style="flex:1; max-width:280px;">
                <span style="display:inline-block; background:#064e3b; color:#ffffff; font-size:0.66rem; font-weight:800; padding:2px 7px; border-radius:4px; margin-bottom:3px; letter-spacing:0.5px;">AUTHORIZED TRAINING CENTRE</span>
                <div style="font-size:1.05rem; font-weight:900; color:#064e3b; line-height:1.2; margin-bottom:2px;">${esc(cName)}</div>
                <div style="font-size:0.82rem; font-weight:800; color:#b45309;">Centre Code: <span style="font-family:monospace;">${esc(cCode)}</span></div>
                <div style="font-size:0.73rem; color:#475569; line-height:1.3; margin-top:2px;">📍 ${esc(cAddress)}</div>
              </div>

              <div style="flex:1; text-align:center;">
                <div style="display:inline-flex; align-items:center; justify-content:center; width:44px; height:44px; border-radius:50%; background:linear-gradient(135deg, #0a2a5e, #064e3b); color:#d4af37; font-weight:900; font-size:1.4rem; box-shadow:0 2px 6px rgba(0,0,0,0.15); margin-bottom:3px; border:2px solid #d4af37;">P</div>
                <div style="font-size:1.15rem; font-weight:900; color:#0a2a5e; letter-spacing:0.5px; line-height:1.2;">PURVANCHAL EDUCATION &amp; SKILL COUNCIL</div>
                <div style="font-size:0.82rem; font-weight:800; color:#b45309; letter-spacing:1px; text-transform:uppercase; margin-top:2px;">OFFICIAL STATEMENT OF MARKS</div>
              </div>

              <div style="display:flex; align-items:flex-start; gap:10px; max-width:260px; text-align:right;">
                <div style="flex:1;">
                  <span style="display:inline-block; font-size:0.68rem; font-weight:700; color:#64748b; text-transform:uppercase;">Director In-charge</span>
                  <div style="font-size:0.88rem; font-weight:800; color:#0f172a; margin-top:1px;">${esc(directorName)}</div>
                  <div style="font-size:0.72rem; font-weight:700; color:#16a34a; margin-top:4px;">
                    <span style="display:inline-block; background:#ecfdf5; border:1px solid #a7f3d0; padding:2px 6px; border-radius:4px;">Validity: ${esc(validityText)}</span>
                  </div>
                </div>
                <div style="width:58px; height:72px; flex-shrink:0; border:2px solid #d4af37; border-radius:6px; overflow:hidden; background:#f8fafc; box-shadow:0 2px 5px rgba(0,0,0,0.08); display:flex; align-items:center; justify-content:center;">
                  ${directorPhotoHtml}
                </div>
              </div>
            </div>

            <div class="grid" style="grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px; background:#f8fafc; padding:10px 14px; border-radius:6px; border:1px solid #e2e8f0; font-size:0.86rem;">
              <div>Candidate Name: <b style="font-size:1.02rem; color:#0f172a;">${esc(d.holder)}</b></div>
              <div>Roll / Student Code: <b style="font-family:monospace; color:#0a2a5e;">${esc(d.roll_no || d.student_code)}</b></div>
              <div>Course Enrolled: <b style="color:#064e3b;">${esc(d.course)}</b></div>
              <div>Exam Session: <b>${esc(d.session)}</b></div>
            </div>

            <div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:10px; padding:14px; display:flex; justify-content:space-around; text-align:center; margin-bottom:14px;">
              <div>
                <span class="muted" style="font-size:0.75rem;">TOTAL SCORE</span>
                <p style="font-weight:700; font-size:1.15rem; color:var(--navy); margin:2px 0 0;">${d.total_obtained} / ${d.total_max}</p>
              </div>
              <div>
                <span class="muted" style="font-size:0.75rem;">PERCENTAGE</span>
                <p style="font-weight:700; font-size:1.15rem; color:var(--navy); margin:2px 0 0;">${d.percentage}%</p>
              </div>
              <div>
                <span class="muted" style="font-size:0.75rem;">GRADE</span>
                <p style="font-weight:700; font-size:1.15rem; color:var(--navy); margin:2px 0 0;">${esc(d.grade)}</p>
              </div>
              <div>
                <span class="muted" style="font-size:0.75rem;">RESULT</span>
                <p style="margin:2px 0 0;">${badge(d.result)}</p>
              </div>
            </div>

            <!-- Bottom 3 Official Mohar & Signatures -->
            <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-top:16px; padding-top:14px; border-top:1.5px dashed #cbd5e1; text-align:center;">
              <div style="display:flex; flex-direction:column; align-items:center;">
                <div style="width:68px; height:68px; border:2px dashed #047857; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#047857; font-size:0.56rem; font-weight:800; text-transform:uppercase; transform:rotate(-4deg); background:rgba(4,120,87,0.04);">
                  <span style="font-size:0.52rem;">★ MOHAR ★</span>
                  <span style="font-size:0.58rem; font-weight:900;">${esc(cCode)}</span>
                  <span style="font-size:0.48rem;">CENTRE SEAL</span>
                </div>
                <div style="font-family:cursive; font-size:1.15rem; color:#064e3b; margin:6px 0 2px; line-height:1;">${esc(directorName)}</div>
                <span style="font-size:0.75rem; font-weight:800; color:#0f172a; border-top:1px solid #94a3b8; display:block; padding-top:3px; width:100%; max-width:160px;">Centre Director Mohar &amp; Sign</span>
              </div>

              <div style="display:flex; flex-direction:column; align-items:center;">
                <div style="width:68px; height:68px; border:2px dashed #0284c7; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#0284c7; font-size:0.56rem; font-weight:800; text-transform:uppercase; transform:rotate(3deg); background:rgba(2,132,199,0.04);">
                  <span style="font-size:0.52rem;">★ REGIONAL ★</span>
                  <span style="font-size:0.58rem; font-weight:900;">COORDINATOR</span>
                  <span style="font-size:0.48rem;">STATE OFFICE</span>
                </div>
                <div style="font-family:cursive; font-size:1.15rem; color:#0369a1; margin:6px 0 2px; line-height:1;">Dr. Rajesh Verma</div>
                <span style="font-size:0.75rem; font-weight:800; color:#0f172a; border-top:1px solid #94a3b8; display:block; padding-top:3px; width:100%; max-width:170px;">Coordinator Office Mohar &amp; Sign</span>
              </div>

              <div style="display:flex; flex-direction:column; align-items:center;">
                <div style="width:68px; height:68px; border:2.5px solid #d4af37; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#b45309; font-size:0.56rem; font-weight:800; text-transform:uppercase; background:radial-gradient(circle, #fefce8, #fef3c7); box-shadow:0 0 6px rgba(212,175,55,0.4);">
                  <span style="font-size:0.52rem;">★ PESC ★</span>
                  <span style="font-size:0.58rem; font-weight:900;">HEAD OFFICE</span>
                  <span style="font-size:0.48rem;">NEW DELHI</span>
                </div>
                <div style="font-family:cursive; font-size:1.15rem; color:#b45309; margin:6px 0 2px; line-height:1;">Prof. S. N. Mishra</div>
                <span style="font-size:0.75rem; font-weight:800; color:#0f172a; border-top:1px solid #94a3b8; display:block; padding-top:3px; width:100%; max-width:160px;">Head Office Mohar &amp; Sign</span>
              </div>
            </div>

            <div style="margin-top:14px; font-size:0.8rem; color:#64748b; text-align:center;">
              ✅ Cryptographically validated on ${new Date().toLocaleDateString('en-IN')} via Purvanchal Education &amp; Skill Council Official Central Ledger.
            </div>
            <div style="margin-top:14px; text-align:center;">
              <button class="btn sm alt" onclick="window.print()">🖨️ Print Official Verification Slip</button>
            </div>
          </div>
        `;
      } else {
        $('#r').innerHTML = `
          <div class="verify-result-box" style="text-align:left; background:#ffffff; border:10px double #d4af37; padding:26px 28px; border-radius:12px; box-shadow:0 8px 30px rgba(0,0,0,0.06); position:relative;">
            <div class="verify-seal-watermark">PESC</div>

            <!-- Top Accreditations & Run By Bar -->
            <div style="border-bottom:2px solid #b45309; padding-bottom:8px; margin-bottom:12px; text-align:center;">
              <div style="font-size:0.92rem; font-weight:800; color:#b45309; letter-spacing:0.8px; text-transform:uppercase;">
                Run by: Purvanchal Shiksha Parishad (पूर्वांचल शिक्षा परिषद द्वारा संचालित)
              </div>
              <div style="font-size:0.72rem; color:#334155; font-weight:600; line-height:1.4; margin-top:3px; max-width:820px; margin-left:auto; margin-right:auto;">
                Register - Ministry of Micro, Small and Medium Enterprises of India (MSME) · Govt. of NCT Delhi · Niti Aayog Recognized · ISO with IAF · ISO 9001:2015 Certified
              </div>
            </div>

            <!-- Institute & Director Top Header Row -->
            <div style="display:flex; justify-content:space-between; align-items:flex-start; border-bottom:1.5px solid #d4af37; padding-bottom:10px; margin-bottom:14px; gap:12px; text-align:left;">
              <div style="flex:1; max-width:280px;">
                <span style="display:inline-block; background:#064e3b; color:#ffffff; font-size:0.66rem; font-weight:800; padding:2px 7px; border-radius:4px; margin-bottom:3px; letter-spacing:0.5px;">AUTHORIZED TRAINING CENTRE</span>
                <div style="font-size:1.05rem; font-weight:900; color:#064e3b; line-height:1.2; margin-bottom:2px;">${esc(cName)}</div>
                <div style="font-size:0.82rem; font-weight:800; color:#b45309;">Centre Code: <span style="font-family:monospace;">${esc(cCode)}</span></div>
                <div style="font-size:0.73rem; color:#475569; line-height:1.3; margin-top:2px;">📍 ${esc(cAddress)}</div>
              </div>

              <div style="flex:1; text-align:center;">
                <div style="display:inline-flex; align-items:center; justify-content:center; width:44px; height:44px; border-radius:50%; background:linear-gradient(135deg, #0a2a5e, #064e3b); color:#d4af37; font-weight:900; font-size:1.4rem; box-shadow:0 2px 6px rgba(0,0,0,0.15); margin-bottom:3px; border:2px solid #d4af37;">P</div>
                <div style="font-size:1.15rem; font-weight:900; color:#0a2a5e; letter-spacing:0.5px; line-height:1.2;">PURVANCHAL EDUCATION &amp; SKILL COUNCIL</div>
                <div style="font-size:0.76rem; font-weight:700; color:#b45309; letter-spacing:1px; text-transform:uppercase; margin-top:2px;">Course Completion Certificate</div>
              </div>

              <div style="display:flex; align-items:flex-start; gap:10px; max-width:260px; text-align:right;">
                <div style="flex:1;">
                  <span style="display:inline-block; font-size:0.68rem; font-weight:700; color:#64748b; text-transform:uppercase;">Director In-charge</span>
                  <div style="font-size:0.88rem; font-weight:800; color:#0f172a; margin-top:1px;">${esc(directorName)}</div>
                  <div style="font-size:0.72rem; font-weight:700; color:#16a34a; margin-top:4px;">
                    <span style="display:inline-block; background:#ecfdf5; border:1px solid #a7f3d0; padding:2px 6px; border-radius:4px;">Validity: ${esc(validityText)}</span>
                  </div>
                </div>
                <div style="width:58px; height:72px; flex-shrink:0; border:2px solid #d4af37; border-radius:6px; overflow:hidden; background:#f8fafc; box-shadow:0 2px 5px rgba(0,0,0,0.08); display:flex; align-items:center; justify-content:center;">
                  ${directorPhotoHtml}
                </div>
              </div>
            </div>

            <div style="margin:14px 0 6px; font-size:1.25rem; font-family:serif; font-style:italic; color:#0f172a; text-align:center;">Statement of Skill Proficiency &amp; Completion</div>
            <div style="font-size:0.9rem; color:#475569; margin-bottom:10px; text-align:center;">This is to officially certify that</div>

            <div style="font-size:1.8rem; font-weight:900; color:#064e3b; text-decoration:underline; text-decoration-color:#d4af37; margin-bottom:6px; letter-spacing:0.5px; text-align:center;">
              ${esc(d.holder)}
            </div>

            <div style="font-size:0.92rem; color:#334155; margin-bottom:12px; text-align:center;">
              Registration / Student Code: <b style="font-family:monospace; color:#0a2a5e;">${esc(d.student_code || d.roll_no)}</b> · Issued On: <b>${esc(d.issued_on)}</b>
            </div>

            <div style="font-size:0.94rem; color:#334155; line-height:1.6; max-width:680px; margin:0 auto 16px; text-align:center;">
              has successfully completed the prescribed curriculum and passed the examination for:
              <div style="font-size:1.3rem; font-weight:800; margin:6px 0; color:#0a2a5e;">"${esc(d.course)}"</div>
              with <b>Grade A+ (Exemplary Performance)</b> conducted under council national quality standards.
            </div>

            <div style="text-align:center; margin-bottom:12px;">
              <span class="badge ${d.status}">${d.status} CERTIFICATE</span> · Certificate No: <b style="font-family:monospace; color:var(--navy);">${esc(d.certificate_no)}</b>
            </div>

            <!-- Bottom 3 Official Mohar & Signatures -->
            <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-top:16px; padding-top:14px; border-top:1.5px dashed #cbd5e1; text-align:center;">
              <div style="display:flex; flex-direction:column; align-items:center;">
                <div style="width:68px; height:68px; border:2px dashed #047857; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#047857; font-size:0.56rem; font-weight:800; text-transform:uppercase; transform:rotate(-4deg); background:rgba(4,120,87,0.04);">
                  <span style="font-size:0.52rem;">★ MOHAR ★</span>
                  <span style="font-size:0.58rem; font-weight:900;">${esc(cCode)}</span>
                  <span style="font-size:0.48rem;">CENTRE SEAL</span>
                </div>
                <div style="font-family:cursive; font-size:1.15rem; color:#064e3b; margin:6px 0 2px; line-height:1;">${esc(directorName)}</div>
                <span style="font-size:0.75rem; font-weight:800; color:#0f172a; border-top:1px solid #94a3b8; display:block; padding-top:3px; width:100%; max-width:160px;">Centre Director Mohar &amp; Sign</span>
              </div>

              <div style="display:flex; flex-direction:column; align-items:center;">
                <div style="width:68px; height:68px; border:2px dashed #0284c7; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#0284c7; font-size:0.56rem; font-weight:800; text-transform:uppercase; transform:rotate(3deg); background:rgba(2,132,199,0.04);">
                  <span style="font-size:0.52rem;">★ REGIONAL ★</span>
                  <span style="font-size:0.58rem; font-weight:900;">COORDINATOR</span>
                  <span style="font-size:0.48rem;">STATE OFFICE</span>
                </div>
                <div style="font-family:cursive; font-size:1.15rem; color:#0369a1; margin:6px 0 2px; line-height:1;">Dr. Rajesh Verma</div>
                <span style="font-size:0.75rem; font-weight:800; color:#0f172a; border-top:1px solid #94a3b8; display:block; padding-top:3px; width:100%; max-width:170px;">Coordinator Office Mohar &amp; Sign</span>
              </div>

              <div style="display:flex; flex-direction:column; align-items:center;">
                <div style="width:68px; height:68px; border:2.5px solid #d4af37; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#b45309; font-size:0.56rem; font-weight:800; text-transform:uppercase; background:radial-gradient(circle, #fefce8, #fef3c7); box-shadow:0 0 6px rgba(212,175,55,0.4);">
                  <span style="font-size:0.52rem;">★ PESC ★</span>
                  <span style="font-size:0.58rem; font-weight:900;">HEAD OFFICE</span>
                  <span style="font-size:0.48rem;">NEW DELHI</span>
                </div>
                <div style="font-family:cursive; font-size:1.15rem; color:#b45309; margin:6px 0 2px; line-height:1;">Prof. S. N. Mishra</div>
                <span style="font-size:0.75rem; font-weight:800; color:#0f172a; border-top:1px solid #94a3b8; display:block; padding-top:3px; width:100%; max-width:160px;">Head Office Mohar &amp; Sign</span>
              </div>
            </div>

            <div style="margin-top:14px; font-size:0.8rem; color:#64748b; text-align:center;">
              ✅ Cryptographically validated on ${new Date().toLocaleDateString('en-IN')} via Purvanchal Education &amp; Skill Council Central Registry.
            </div>
            <div style="margin-top:14px; text-align:center;">
              <button class="btn sm alt" onclick="window.print()">🖨️ Print Official Verification Slip</button>
            </div>
          </div>
        `;
      }
    });
  </script>
</body>
</html>
