  <script>
    guard(async () => {
      const path = location.pathname;
      const urlParams = new URLSearchParams(location.search);
      let rawToken = urlParams.get('token') || urlParams.get('cert_no') || urlParams.get('code') || urlParams.get('roll_no') || urlParams.get('marksheet_no') || '';
      if (!rawToken) {
        const parts = path.split('/').filter(Boolean);
        if (parts.length > 1 && parts[parts.length - 1] !== 'verify') {
          rawToken = parts[parts.length - 1];
        }
      }
      rawToken = (rawToken || '').trim();

      if (!rawToken) {
        $('#r').innerHTML = `
          <div style="padding:24px; background:#f8fafc; border:1.5px solid #cbd5e1; border-radius:12px; text-align:left;">
            <h3 style="color:#0a2a5e; margin:0 0 10px;">🔍 Verify Candidate Credential</h3>
            <p class="muted" style="margin-bottom:16px;">Enter Certificate Number, Roll Number, Marksheet Number, or Verification Token:</p>
            <form onsubmit="event.preventDefault(); const v=this.q.value.trim(); if(v) location.href='/verify/' + encodeURIComponent(v);" style="display:flex; gap:10px; flex-wrap:wrap;">
              <input name="q" placeholder="e.g. PESC-26-00008, PESC/2026/000001, or cert-token" required style="flex:1; min-width:240px; padding:10px 14px; border:1px solid #cbd5e1; border-radius:6px; font-weight:600;">
              <button class="btn gold" style="font-weight:800; padding:10px 20px;">Verify Now</button>
            </form>
          </div>
        `;
        return;
      }

      const token = encodeURIComponent(rawToken);
      let d;

      if (path.includes('/marksheet/')) {
        d = await api('/api/public/verify/marksheet/' + token).catch(() => null);
      } else if (path.includes('/coordinator/')) {
        d = await api('/api/public/verify/coordinator/' + token).catch(() => null);
      } else {
        d = await api('/api/public/verify/' + token).catch(() => null);
      }

      if (!d || d.status === 'Not Found') {
        $('#r').innerHTML = `
          <div style="padding:24px; background:#fef2f2; border:1px solid #fecaca; border-radius:12px;">
            <div style="font-size:3rem; margin-bottom:8px;">❌</div>
            <h3 style="color:#b91c1c; margin:0 0 6px;">Invalid or Record Not Found</h3>
            <p class="muted" style="margin-bottom:16px;">Identifier <b>"${esc(rawToken)}"</b> was not found in the council's central registry. Please verify the roll number or certificate token.</p>

      const cAddress = d.institute_address || 'City Campus, Main Road';
      const directorName = d.director_name || 'Dr. Ramesh Kumar';
      const directorPhoto = d.director_photo || '';

    function getCourseCurriculumSubjects(courseNameOrCode, evalPattern, termName) {
      const norm = String(courseNameOrCode || '').toUpperCase();
      const pattern = (evalPattern === 'semester') ? 'semester' : 'yearly';
      const term = String(termName || (pattern === 'semester' ? 'Semester 1' : 'Annual Examination')).trim();

      let key = Object.keys(COURSE_CURRICULUM_DATA).find(k => norm === k || norm.includes(k) || (COURSE_CURRICULUM_DATA[k].name && norm.includes(COURSE_CURRICULUM_DATA[k].name.toUpperCase())));
      if (!key) {
        if (norm.includes('NURSERY') || norm.includes('NTT') || norm.includes('TEACHER')) key = 'NTT';
        else if (norm.includes('ADVANCED') || norm.includes('ADCA')) key = 'ADCA';
        else if (norm.includes('DCA')) key = 'DCA';
        else if (norm.includes('TALLY')) key = 'TALLY';
        else if (norm.includes('CCC')) key = 'CCC';
        else if (norm.includes('PGDCA')) key = 'PGDCA';
        else if (norm.includes('DTP') || norm.includes('PUBLISHING')) key = 'DTP';
        else if (norm.includes('HARDWARE') || norm.includes('NETWORKING')) key = 'HARDWARE';
        else if (norm.includes('YOGA')) key = 'YOGA';
        else if (norm.includes('FASHION')) key = 'FASHION';
      }

      if (key && COURSE_CURRICULUM_DATA[key]) {
        const courseObj = COURSE_CURRICULUM_DATA[key];
        const patObj = courseObj[pattern] || {};

        if (patObj[term]) return patObj[term];

        if (pattern === 'semester') {
          if (term.includes('2') || term.toLowerCase().includes('second')) return patObj['Semester 2'] || Object.values(patObj)[1] || patObj['Semester 1'];
          if (term.includes('3') || term.toLowerCase().includes('third')) return patObj['Semester 3'] || Object.values(patObj)[2] || patObj['Semester 1'];
          if (term.includes('4') || term.toLowerCase().includes('fourth')) return patObj['Semester 4'] || Object.values(patObj)[3] || patObj['Semester 1'];
          return patObj['Semester 1'] || Object.values(patObj)[0];
        } else {
          if (term.includes('2nd') || term.toLowerCase().includes('second')) return patObj['2nd Year'] || patObj['Annual Examination'];
          if (term.includes('Final') || term.toLowerCase().includes('final')) return patObj['Final Year'] || patObj['2nd Year'] || patObj['Annual Examination'];
          if (term.includes('1st') || term.toLowerCase().includes('first')) return patObj['1st Year'] || patObj['Annual Examination'];
          return patObj['Annual Examination'] || Object.values(patObj)[0];
        }
      }

      const cLabel = courseNameOrCode || 'Vocational';
      if (pattern === 'semester') {
        const semNum = term.match(/\d+/) ? term.match(/\d+/)[0] : '1';
        return [
          { code: `SEM${semNum}-01`, name: `${cLabel} Theory & Fundamentals (Sem-${semNum})`, max_marks: 100, theory: 45, practical: 45 },

                            <td style="padding:6px 8px; border:1px solid #cbd5e1; font-family:monospace; font-weight:700; color:#072a60;">${esc(s.code || `SUB${idx+1}`)}</td>

                            <td style="padding:6px 8px; border:1px solid #cbd5e1; text-align:center; font-weight:700; color:#0f172a;">${sObt}</td>
                            <td style="padding:6px 8px; border:1px solid #cbd5e1; text-align:center; font-weight:800; color:#16a34a;">${sGrd}</td>
                          </tr>
                        `;
                      }).join('')}

                  </table>
                </div>
              `;
            })()}

                <span class="muted" style="font-size:0.75rem; font-weight:700;">PERCENTAGE</span>
                <p style="font-weight:900; font-size:1.2rem; color:#072a60; margin:2px 0 0;">${d.percentage}%</p>
              </div>

            <div style="margin-top:16px; font-size:0.82rem; color:#16a34a; font-weight:800; text-align:center;">

              <button class="btn sm alt" onclick="window.print()">🖨️ Print Official Verification Slip</button>
            </div>
          </div>
        `;

              refNo: d.certificate_no || 'PESC-CERT-2026-0007',
              issueDate: d.issued_on || '04-10-2026',
              issuePlace: d.place_of_issue || 'Regional Council Office, Shahgarh, Azamgarh UP',
              headOffice: d.head_office || 'Shahgarh, Azamgarh UP 276001'
            })}

            <!-- Top Section: QR Code on Left, Ribbon in Center, Student Photo on Right (Opposite) -->

              ${qrCodeBoxHtml}

              <!-- Center: Ribbon Title -->
              <div style="flex:1; text-align:center; padding:0 6px;">

                  ${studentPhotoHtml}
                  <div style="position:absolute; bottom:0; left:0; right:0; background:rgba(7,42,96,0.88); color:#ffffff; font-size:0.46rem; font-weight:900; padding:1px 0; text-align:center;">PESC VERIFIED</div>

            <div style="font-size:0.95rem; color:#000000; font-weight:700; line-height:2.3; text-align:center; margin:18px auto 16px; max-width:740px;">
              THIS IS TO CERTIFY THAT MR. / MRS. <span style="font-size:1.32rem; font-weight:900; color:#072a60; border-bottom:1.8px solid #072a60; padding:0 10px;">${esc(d.holder)}</span>
              ${d.father_name && d.father_name !== 'N/A' ? `<br>SON / DAUGHTER OF SHRI <span style="font-size:1.05rem; font-weight:900; color:#0f172a; border-bottom:1.5px solid #64748b; padding:0 8px;">${esc(d.father_name)}</span>` : ''}<br>

              directorName: directorName,

            <div style="margin-top:16px; font-size:0.82rem; color:#16a34a; font-weight:800; text-align:center;">
