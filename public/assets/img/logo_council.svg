<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="pescGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="pescNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2558"/>
      <stop offset="100%" stop-color="#061838"/>
    </linearGradient>
    <filter id="pescShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Circular Outer Shield -->
  <circle cx="100" cy="100" r="94" fill="url(#pescNavy)" stroke="url(#pescGold)" stroke-width="4" filter="url(#pescShadow)"/>
  <circle cx="100" cy="100" r="87" fill="none" stroke="url(#pescGold)" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- Top Stars -->
  <g fill="url(#pescGold)">
    <polygon points="100,24 102.5,31 110,31 104,35 106,42 100,38 94,42 96,35 90,31 97.5,31" transform="scale(0.8) translate(25, 4)"/>
    <polygon points="100,24 102.5,31 110,31 104,35 106,42 100,38 94,42 96,35 90,31 97.5,31" transform="scale(0.6) translate(30, 20)"/>
    <polygon points="100,24 102.5,31 110,31 104,35 106,42 100,38 94,42 96,35 90,31 97.5,31" transform="scale(0.6) translate(103, 20)"/>
  </g>

  <!-- Radiant Torch of Wisdom / Flame -->
  <path d="M100 42 C106 50 108 57 103 64 C99 69 95 65 93 60 C92 53 96 46 100 42 Z" fill="#ef4444"/>
  <path d="M100 46 C103 52 104 57 101 61 C98 64 96 62 95 58 C95 53 97 49 100 46 Z" fill="#fbbf24"/>
  <!-- Torch Handle Base -->
  <path d="M94 65 L106 65 L103 76 L97 76 Z" fill="url(#pescGold)"/>

  <!-- Open Book of Knowledge -->
  <path d="M100 86 C86 80 68 83 60 88 L60 116 C68 111 86 108 100 114 C114 108 132 111 140 116 L140 88 C132 83 114 80 100 86 Z" fill="#ffffff" stroke="url(#pescGold)" stroke-width="2.5"/>
  <line x1="100" y1="86" x2="100" y2="114" stroke="url(#pescGold)" stroke-width="2.5"/>
  <!-- Page Lines -->
  <line x1="68" y1="94" x2="92" y2="92" stroke="#0a2558" stroke-width="1.2" opacity="0.7"/>
  <line x1="68" y1="100" x2="92" y2="98" stroke="#0a2558" stroke-width="1.2" opacity="0.7"/>
  <line x1="68" y1="106" x2="90" y2="104" stroke="#0a2558" stroke-width="1.2" opacity="0.7"/>
  <line x1="108" y1="92" x2="132" y2="94" stroke="#0a2558" stroke-width="1.2" opacity="0.7"/>
  <line x1="108" y1="98" x2="132" y2="100" stroke="#0a2558" stroke-width="1.2" opacity="0.7"/>
  <line x1="110" y1="104" x2="132" y2="106" stroke="#0a2558" stroke-width="1.2" opacity="0.7"/>

  <!-- PESC Acronym Banner -->
  <rect x="58" y="122" width="84" height="22" rx="4" fill="url(#pescGold)"/>
  <text x="100" y="138" font-family="'Inter', 'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#061838" text-anchor="middle" letter-spacing="3">PESC</text>

  <!-- Council Title Sub-text -->
  <text x="100" y="156" font-family="'Inter', Arial, sans-serif" font-size="7.5" font-weight="800" fill="#fde047" text-anchor="middle" letter-spacing="1.2">PURVANCHAL COUNCIL</text>
  <text x="100" y="167" font-family="'Inter', Arial, sans-serif" font-size="6.5" font-weight="700" fill="#e2e8f0" text-anchor="middle" letter-spacing="0.8">EDUCATION &amp; SKILL</text>
  <text x="100" y="177" font-family="'Inter', Arial, sans-serif" font-size="5.5" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="1">GOVT. RECOGNISED</text>
</svg>
