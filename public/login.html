<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login – Purvanchal Education & Skill Council</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    .pw-wrap { position: relative; width: 100%; margin-bottom: 18px; }
    .pw-wrap input { width: 100%; padding: 10px 42px 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; }
    .pw-toggle { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 1.1rem; color: #64748b; padding: 4px; }
  </style>
</head>
<body style="display:flex; flex-direction:column; min-height:100vh;">
  <nav class="nav">
    <a href="/" class="brand">
      <div class="brand-logo">P</div>
      <div class="brand-text">
        <b>PESC Council</b>
        <span>Purvanchal Education & Skill Council</span>
      </div>
    </a>
    <div class="nav-links" style="margin-left:auto;">
      <a href="/">← Back to Home</a>
    </div>
  </nav>

  <main style="max-width:440px; margin:40px auto; width:100%; padding:0 16px; flex:1;">
    <section class="card" style="box-shadow:var(--shadow-lg);">
      <div style="text-align:center; margin-bottom:24px;">
        <div style="width:56px; height:56px; margin:0 auto 12px; background:var(--navy); color:#fff; border-radius:12px; display:grid; place-items:center; font-size:1.6rem; font-weight:800; border:2px solid var(--gold);">
          P
        </div>
        <h2 id="loginTitle" style="color:var(--navy); margin-bottom:6px;">Sign In to Portal</h2>
        <p id="loginSub" class="muted" style="font-size:0.88rem;">Super Admin, Coordinator, Centre & Student Login</p>
      </div>

      <div id="errMsg" style="display:none; background:#fee2e2; color:#991b1b; padding:12px 14px; border-radius:8px; border:1px solid #f87171; font-size:0.88rem; margin-bottom:16px;"></div>

      <form id="f" onsubmit="event.preventDefault(); handleLogin(event); return false;">
        <label style="font-weight:600; font-size:0.88rem; margin-bottom:6px; display:block;">Email or Login ID</label>
        <input name="email" id="email" type="text" required autocomplete="username" placeholder="Enter registered email or roll number" style="width:100%; padding:10px 14px; margin-bottom:14px; border:1px solid #cbd5e1; border-radius:8px; font-size:0.95rem;">

        <label style="font-weight:600; font-size:0.88rem; margin-bottom:6px; display:block;">Password</label>
        <div class="pw-wrap">
          <input name="password" id="password" type="password" required autocomplete="current-password" placeholder="••••••••">
          <button type="button" class="pw-toggle" id="pwToggle" title="Toggle password visibility">👁️</button>
        </div>

        <button id="subBtn" class="btn" style="width:100%; padding:12px; font-size:1rem; font-weight:600; cursor:pointer;">
          Sign In
        </button>

        <div style="margin-top:18px; text-align:center; font-size:0.85rem;">
          <a href="#" id="fg" class="muted" style="text-decoration:none;">Forgot password?</a>
        </div>
      </form>
    </section>
  </main>

  <script src="/assets/js/app.js"></script>
  <script>
    const errBox = document.getElementById('errMsg');
    const emailInput = document.getElementById('email');
    const pwInput = document.getElementById('password');
    const subBtn = document.getElementById('subBtn');
    const pwToggle = document.getElementById('pwToggle');

    // Role-specific customized branding
    try {
      const qParams = new URLSearchParams(window.location.search);
      const roleParam = qParams.get('role');
      if (roleParam === 'student') {
        const lt = document.getElementById('loginTitle');
        const ls = document.getElementById('loginSub');
        if (lt) lt.textContent = '🎓 Candidate / Student Login';
        if (ls) ls.textContent = 'Access your syllabus, admit cards, marksheets & certificates';
        if (emailInput) emailInput.placeholder = 'Enter Roll Number or Student Email';
      } else if (roleParam === 'centre') {
        const lt = document.getElementById('loginTitle');
        const ls = document.getElementById('loginSub');
        if (lt) lt.textContent = '🏢 Franchise Centre Admin Login';
        if (ls) ls.textContent = 'Authorized Institute Director & Staff Management Portal';
        if (emailInput) emailInput.placeholder = 'Enter Centre Email or Director Mobile';
      }
    } catch (_) {}

    // Clean any query string or hash immediately
    if (window.location.search || window.location.hash) {
      window.history.replaceState({}, document.title, window.location.pathname);
    }

    // Toggle password visibility
    pwToggle.onclick = () => {
      const isPw = pwInput.type === 'password';
      pwInput.type = isPw ? 'text' : 'password';
      pwToggle.textContent = isPw ? '🙈' : '👁️';
    };

    // Auto-redirect if already logged in
    (async () => {
      try {
        const me = await api('/api/auth/me');
        if (me && me.user) {
          if (['super_admin', 'admin'].includes(me.user.role)) window.location.replace('/admin');
          else if (me.user.role === 'coordinator') window.location.replace('/coordinator');
          else if (me.user.role === 'student') window.location.replace('/student');
          else window.location.replace('/portal');
        }
      } catch (_) {}
    })();

    async function handleLogin(e) {
      if (e) {
        try { e.preventDefault(); e.stopPropagation(); } catch (_) {}
      }
      errBox.style.display = 'none';
      errBox.textContent = '';

      const emailVal = emailInput.value.trim();
      const pwVal = pwInput.value.trim();

      if (!emailVal || !pwVal) {
        errBox.textContent = 'Please enter both email and password';
        errBox.style.display = 'block';
        return false;
      }

      subBtn.disabled = true;
      subBtn.textContent = 'Signing in…';

      try {
        const body = { email: emailVal, password: pwVal };
        const d = await api('/api/auth/login', { method: 'POST', body });
        if (['super_admin', 'admin'].includes(d.user.role)) {
          window.location.replace('/admin');
        } else if (d.user.role === 'coordinator') {
          window.location.replace('/coordinator');
        } else if (d.user.role === 'student') {
          window.location.replace('/student');
        } else {
          window.location.replace('/portal');
        }
      } catch (err) {
        errBox.textContent = err.message || 'Invalid credentials or login failed';
        errBox.style.display = 'block';
        subBtn.disabled = false;
        subBtn.textContent = 'Sign In';
      }
      return false;
    }

    window.handleLogin = handleLogin;
    document.getElementById('f').addEventListener('submit', handleLogin);

    // Forgot Password via Mobile OTP Modal
    const modalHtml = `
      <div id="otpModal" style="display:none; position:fixed; inset:0; background:rgba(15,23,42,0.65); z-index:9999; place-items:center; padding:16px; backdrop-filter:blur(3px);">
        <div style="background:#fff; border-radius:14px; max-width:440px; width:100%; box-shadow:var(--shadow-lg); border:1px solid #cbd5e1; overflow:hidden;">
          <div style="background:var(--navy); color:#fff; padding:16px 20px; display:flex; justify-content:space-between; align-items:center;">
            <h3 style="margin:0; font-size:1.15rem; color:#fff;">🔐 Reset Password via Mobile OTP</h3>
            <button id="closeOtpModal" type="button" style="background:none; border:none; color:#fff; font-size:1.4rem; cursor:pointer; line-height:1;">&times;</button>
          </div>
          <div style="padding:22px;">
            <div id="otpMsg" style="display:none; padding:10px 14px; border-radius:8px; font-size:0.86rem; margin-bottom:14px;"></div>

            <!-- Step 1: Send OTP -->
            <div id="otpStep1">
              <label style="font-weight:600; font-size:0.88rem; display:block; margin-bottom:6px;">Registered Mobile, Email or Centre Code *</label>
              <input id="otpIdentInput" type="text" placeholder="e.g. 9876543210 or PESC00001" style="width:100%; padding:10px 14px; border:1px solid #cbd5e1; border-radius:8px; margin-bottom:14px; font-size:0.95rem;">
              <button id="btnSendOtp" class="btn gold" style="width:100%; padding:11px; font-weight:600;">📱 Send 6-Digit OTP</button>
            </div>

            <!-- Step 2: Verify OTP & New Password -->
            <div id="otpStep2" style="display:none;">
              <p class="muted" id="otpTargetNote" style="font-size:0.84rem; margin-bottom:12px;"></p>
              <label style="font-weight:600; font-size:0.88rem; display:block; margin-bottom:6px;">Enter 6-Digit OTP *</label>
              <input id="otpCodeInput" type="text" maxlength="6" placeholder="123456" style="width:100%; padding:10px 14px; border:1px solid #cbd5e1; border-radius:8px; margin-bottom:12px; font-size:1.1rem; letter-spacing:4px; font-family:monospace; text-align:center;">

              <label style="font-weight:600; font-size:0.88rem; display:block; margin-bottom:6px;">Create New Password *</label>
              <input id="newPwInput" type="password" placeholder="Minimum 6 characters" style="width:100%; padding:10px 14px; border:1px solid #cbd5e1; border-radius:8px; margin-bottom:16px; font-size:0.95rem;">

              <button id="btnVerifyOtp" class="btn" style="width:100%; padding:11px; font-weight:600;">✅ Verify OTP &amp; Reset Password</button>
              <div style="margin-top:10px; text-align:center;">
                <button type="button" id="btnResendOtp" style="background:none; border:none; color:#2563eb; cursor:pointer; font-size:0.84rem;">← Change Number / Resend OTP</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    `;
    document.body.insertAdjacentHTML('beforeend', modalHtml);

    const otpModal = document.getElementById('otpModal');
    const closeOtpModal = document.getElementById('closeOtpModal');
    const otpMsg = document.getElementById('otpMsg');
    const otpStep1 = document.getElementById('otpStep1');
    const otpStep2 = document.getElementById('otpStep2');
    const otpIdentInput = document.getElementById('otpIdentInput');
    const otpCodeInput = document.getElementById('otpCodeInput');
    const newPwInput = document.getElementById('newPwInput');
    const btnSendOtp = document.getElementById('btnSendOtp');
    const btnVerifyOtp = document.getElementById('btnVerifyOtp');
    const btnResendOtp = document.getElementById('btnResendOtp');
    const otpTargetNote = document.getElementById('otpTargetNote');

    let activeIdent = '';

    document.getElementById('fg').onclick = (e) => {
      e.preventDefault();
      otpModal.style.display = 'grid';
      otpStep1.style.display = 'block';
      otpStep2.style.display = 'none';
      otpMsg.style.display = 'none';
      otpIdentInput.value = emailInput.value.trim();
      otpIdentInput.focus();
    };

    closeOtpModal.onclick = () => { otpModal.style.display = 'none'; };

    btnSendOtp.onclick = async () => {
      const val = otpIdentInput.value.trim();
      if (!val) {
        showOtpAlert('Please enter your registered mobile number, email, or centre code.', true);
        return;
      }
      btnSendOtp.disabled = true;
      btnSendOtp.textContent = 'Sending OTP…';
      try {
        const res = await api('/api/auth/otp/send', { method: 'POST', body: { identifier: val } });
        activeIdent = val;
        showOtpAlert(res.message, false);
        otpTargetNote.textContent = `Verification OTP sent to ${res.mobile_masked || val}`;
        if (res.dev_otp) {
          otpCodeInput.value = res.dev_otp; // Auto-populate for fast testing/demo
        }
        otpStep1.style.display = 'none';
        otpStep2.style.display = 'block';
        otpCodeInput.focus();
      } catch (err) {
        showOtpAlert(err.message || 'Failed to send OTP. Please check your credentials.', true);
      } finally {
        btnSendOtp.disabled = false;
        btnSendOtp.textContent = '📱 Send 6-Digit OTP';
      }
    };

    btnResendOtp.onclick = () => {
      otpStep2.style.display = 'none';
      otpStep1.style.display = 'block';
      otpMsg.style.display = 'none';
    };

    btnVerifyOtp.onclick = async () => {
      const otp = otpCodeInput.value.trim();
      const newPw = newPwInput.value.trim();
      if (!otp || otp.length < 4) {
        showOtpAlert('Please enter valid 6-digit OTP code.', true);
        return;
      }
      if (!newPw || newPw.length < 6) {
        showOtpAlert('New password must be at least 6 characters long.', true);
        return;
      }
      btnVerifyOtp.disabled = true;
      btnVerifyOtp.textContent = 'Updating Password…';
      try {
        const res = await api('/api/auth/otp/verify-reset', {
          method: 'POST',
          body: { identifier: activeIdent, otp, new_password: newPw }
        });
        otpModal.style.display = 'none';
        toast(res.message || 'Password reset successfully!');
        emailInput.value = activeIdent;
        pwInput.value = newPw;
        pwInput.focus();
      } catch (err) {
        showOtpAlert(err.message || 'OTP verification failed. Please try again.', true);
      } finally {
        btnVerifyOtp.disabled = false;
        btnVerifyOtp.textContent = '✅ Verify OTP & Reset Password';
      }
    };

    function showOtpAlert(msg, isError) {
      otpMsg.textContent = msg;
      otpMsg.style.display = 'block';
      otpMsg.style.background = isError ? '#fee2e2' : '#dcfce7';
      otpMsg.style.color = isError ? '#991b1b' : '#166534';
      otpMsg.style.border = isError ? '1px solid #f87171' : '1px solid #86efac';
    }
  </script>
</body>
</html>
