<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Set Password – PES Council</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    body {
      background: linear-gradient(135deg, #022c22 0%, #064e3b 60%, #0f172a 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      margin: 0;
    }
    .setup-card {
      background: #ffffff;
      border-radius: 18px;
      max-width: 440px;
      width: 100%;
      padding: 32px 28px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
      box-sizing: border-box;
    }
    .setup-logo {
      width: 56px;
      height: 56px;
      border-radius: 12px;
      background: #047857;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      margin: 0 auto 12px;
    }
    h2 {
      margin: 0 0 6px;
      color: #064e3b;
      font-size: 1.4rem;
      text-align: center;
    }
    .subtext {
      color: #64748b;
      font-size: 0.88rem;
      text-align: center;
      margin: 0 0 20px;
    }
    label {
      font-size: 0.86rem;
      font-weight: 700;
      color: #334155;
      display: block;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 11px 13px;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.92rem;
      margin-bottom: 14px;
      box-sizing: border-box;
      outline: none;
    }
    button.btn-primary {
      width: 100%;
      padding: 12px;
      background: #047857;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(4,120,87,0.3);
      transition: all 0.2s;
    }
    button.btn-primary:hover {
      background: #065f46;
    }
    .msg-box {
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.88rem;
      margin-bottom: 14px;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>
  <div class="setup-card">
    <div class="setup-logo">🔑</div>
    <h2>Set Login Password</h2>
    <p class="subtext">Purvanchal Education & Skill Council (PESC)</p>

    <div id="setupMsg" class="msg-box"></div>

    <form id="setupForm">
      <div id="identGroup">
        <label>Centre Code or Registered Mobile / Email</label>
        <input type="text" id="identInput" name="identifier" placeholder="e.g. PESC00001 or 9876543210">
      </div>

      <label>New Password (min 6 characters)</label>
      <input type="password" id="pwInput" name="password" minlength="6" required autocomplete="new-password" placeholder="••••••••">

      <label>Confirm Password</label>
      <input type="password" id="confirmPwInput" minlength="6" required autocomplete="new-password" placeholder="••••••••">

      <button type="submit" class="btn-primary">Save Password & Continue →</button>
    </form>

    <div style="text-align:center; margin-top:16px;">
      <a href="/portal" style="color:#047857; font-weight:700; font-size:0.85rem; text-decoration:none;">← Return to Centre ERP Portal</a>
    </div>
  </div>

  <script src="/assets/js/app.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const token = params.get('token') || '';
    const ident = params.get('identifier') || params.get('code') || '';

    if (ident && $('#identInput')) $('#identInput').value = ident;
    if (token) {
      $('#identGroup').style.display = 'none';
      if ($('#identInput')) $('#identInput').required = false;
    } else {
      if ($('#identInput')) $('#identInput').required = true;
    }

    $('#setupForm').onsubmit = (e) => {
      e.preventDefault();
      const pw = $('#pwInput').value.trim();
      const cpw = $('#confirmPwInput').value.trim();
      const msg = $('#setupMsg');

      if (pw !== cpw) {
        msg.style.display = 'block';
        msg.style.background = '#fef2f2';
        msg.style.color = '#b91c1c';
        msg.textContent = '✕ Passwords do not match!';
        return;
      }

      guard(async () => {
        msg.style.display = 'block';
        msg.style.background = '#fef3c7';
        msg.style.color = '#b45309';
        msg.textContent = 'Saving new password...';

        if (token) {
          await api('/api/auth/setup', {
            method: 'POST',
            body: { token, password: pw }
          });
          msg.style.background = '#dcfce7';
          msg.style.color = '#15803d';
          msg.textContent = '✓ Password saved successfully! Redirecting to login...';
          setTimeout(() => (location.href = '/portal'), 1200);
        } else {
          const idVal = $('#identInput').value.trim();
          const res = await api('/api/auth/franchise-set-password', {
            method: 'POST',
            body: { identifier: idVal, password: pw }
          });
          msg.style.background = '#dcfce7';
          msg.style.color = '#15803d';
          msg.textContent = '✓ ' + (res.message || 'Password saved successfully!');
          toast('Password created! Opening Centre ERP...');
          setTimeout(() => (location.href = '/portal'), 1200);
        }
      });
    };
  </script>
</body>
</html>
