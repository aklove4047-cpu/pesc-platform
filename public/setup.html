<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Set password – PESC</title><link rel="stylesheet" href="/assets/css/style.css"></head><body>
<nav class="nav"><b>PESC</b></nav><main style="max-width:420px"><section class="card"><h2>Set your password</h2>
<form id="f"><label>New password (min 10 characters)</label><input name="password" type="password" minlength="10" required autocomplete="new-password"><br><br><button>Save password</button></form></section></main>
<script src="/assets/js/app.js"></script><script>
const token = new URLSearchParams(location.search).get('token') || '';
$('#f').onsubmit = (e) => { e.preventDefault(); guard(async () => { await api('/api/auth/setup', { method: 'POST', body: { token, password: form(e.target).password } }); toast('Password saved'); setTimeout(() => (location = '/login'), 1200); }); };
</script></body></html>
