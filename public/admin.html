<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Panel – Purvanchal Education &amp; Skill Council</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    /* Admin Top Options & Navigation - Ultra Clear White & Gold Contrast on Blue Background */
    body {
      background: radial-gradient(circle at 15% 10%, #071a33 0%, #0b254a 45%, #133973 85%, #1b4992 100%) fixed !important;
      min-height: 100vh;
      color: #0f172a;
    }

    .nav {
      background: rgba(7, 26, 51, 0.98) !important;
      border-bottom: 2px solid rgba(212, 175, 55, 0.4) !important;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4) !important;
    }

    .nav-links a {
      color: #ffffff !important;
      font-weight: 600 !important;
      background: rgba(255, 255, 255, 0.1) !important;
      border: 1px solid rgba(255, 255, 255, 0.22) !important;
      border-radius: 8px !important;
      padding: 6px 14px !important;
      font-size: 0.84rem !important;
      transition: all 0.2s ease !important;
      text-decoration: none !important;
      display: inline-flex !important;
      align-items: center !important;
      gap: 5px !important;
    }

    .nav-links a:hover {
      background: rgba(255, 255, 255, 0.22) !important;
      color: #fde047 !important;
      border-color: rgba(212, 175, 55, 0.6) !important;
      transform: translateY(-1px);
    }

    .nav-links a.btn-cta {
      background: linear-gradient(135deg, #d4af37 0%, #eab308 100%) !important;
      color: #071a33 !important;
      border: 1px solid #fef08a !important;
      font-weight: 800 !important;
      box-shadow: 0 4px 14px rgba(212, 175, 55, 0.35) !important;
    }

    .nav-links a.btn-cta:hover {
      background: linear-gradient(135deg, #eab308 0%, #facc15 100%) !important;
      transform: translateY(-2px);
    }

    /* Executive Top Tabs Floating Bar */
    .tabs {
      display: flex !important;
      gap: 10px !important;
      padding: 10px 14px !important;
      background: rgba(7, 26, 51, 0.88) !important;
      backdrop-filter: blur(16px) !important;
      -webkit-backdrop-filter: blur(16px) !important;
      border: 1.5px solid rgba(212, 175, 55, 0.45) !important;
      border-radius: 14px !important;
      margin-bottom: 24px !important;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35) !important;
      flex-wrap: wrap !important;
      align-items: center !important;
    }

    .tabs button {
      background: rgba(255, 255, 255, 0.12) !important;
      border: 1px solid rgba(255, 255, 255, 0.22) !important;
      color: #ffffff !important; /* PURE WHITE TEXT - Never Black */
      font-size: 0.94rem !important;
      font-weight: 700 !important;
      padding: 10px 20px !important;
      border-radius: 9px !important;
      cursor: pointer !important;
      display: inline-flex !important;
      align-items: center !important;
      gap: 8px !important;
      letter-spacing: 0.3px !important;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1) !important;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6) !important;
    }

    .tabs button:hover {
      background: rgba(255, 255, 255, 0.25) !important;
      color: #fde047 !important;
      border-color: rgba(212, 175, 55, 0.8) !important;
      transform: translateY(-2px) !important;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3) !important;
    }

    .tabs button.on, .tabs button.active {
      background: linear-gradient(135deg, #d4af37 0%, #f59e0b 50%, #d97706 100%) !important;
      color: #071a33 !important; /* Bold navy text on bright gold pill */
      border: 1.5px solid #fef08a !important;
      font-weight: 800 !important;
      box-shadow: 0 4px 18px rgba(212, 175, 55, 0.55) !important;
      text-shadow: none !important;
      transform: translateY(-1px) !important;
    }

    #who {
      font-weight: 700;
      color: #fde047;
      font-size: 0.92rem;
      margin-right: 6px;
      cursor: pointer;
      padding: 5px 12px;
      background: rgba(212, 175, 55, 0.18);
      border: 1px solid rgba(212, 175, 55, 0.45);
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    #who:hover {
      background: rgba(212, 175, 55, 0.35);
      border-color: #fde047;
      transform: translateY(-1px);
    }

    @media print {
      nav, .tabs, #modalCloseBtn, button, .nav-links {
        display: none !important;
      }
      body {
        background: #ffffff !important;
        color: #000000 !important;
      }
      #adminModalOverlay {
        position: static !important;
        background: transparent !important;
        padding: 0 !important;
        display: block !important;
      }
      #adminModalOverlay > div {
        box-shadow: none !important;
        border: none !important;
        max-width: 100% !important;
      }
      #adminModalOverlay > div > div:first-child {
        display: none !important;
      }
    }
  </style>
</head>
<body>
<nav class="nav">
  <a href="/" class="brand">
    <div class="brand-emblem">P</div>
    <div class="brand-text">
      <b>PESC Head Office</b>
      <span>Central Administration Control</span>
    </div>
  </a>
  <div class="nav-links">
    <span id="who" title="Click to view &amp; edit Admin Profile">👤 Admin</span>
    <a href="/portal" target="_blank">🏢 Centre Portal</a>
    <a href="/coordinator" target="_blank">👔 Coordinator</a>
    <a href="/student" target="_blank">🎓 Student</a>
    <a href="/" target="_blank">🌐 Public Site</a>
    <a href="#" id="out" class="btn-cta">Sign Out</a>
  </div>
</nav>

<main>
  <div class="tabs" id="tabs"></div>
  <section class="card" id="view">Loading…</section>
</main>

<script src="/assets/js/app.js"></script>
<script src="/assets/js/admin.js"></script>
</body>
</html>
