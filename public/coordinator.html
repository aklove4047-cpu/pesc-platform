<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coordinator Panel – PESC Council</title>
  <meta name="description" content="Regional Coordinator Dashboard – Purvanchal Shiksha Parishad. Manage centres, approve marksheets, issue certificates and generate reports.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    /* Coordinator-specific enhancements */
    .centre-card:hover {
      box-shadow: 0 4px 20px rgba(37,99,235,0.12);
    }
    .centre-card [id^="detail_"] {
      animation: fadeInDown 0.2s ease;
    }
    @keyframes fadeInDown {
      from { opacity:0; transform:translateY(-8px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .upload-box { padding:14px; border:1px solid #e2e8f0; border-radius:10px; background:#fafbfc; }
    .upload-box:hover { border-color:#93c5fd; }
    #photoBox, #moharBox, #signBox { transition: border-color 0.2s; }
    #photoBox:hover, #moharBox:hover, #signBox:hover { border-color:#3b82f6; }
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.55); display:flex; align-items:center; justify-content:center; z-index:9000; }
    .modal-content { background:#fff; border-radius:16px; padding:28px; max-width:90vw; max-height:90vh; overflow-y:auto; width:680px; box-shadow:0 20px 60px rgba(0,0,0,0.25); }
    .inp { width:100%; box-sizing:border-box; padding:10px 14px; border:1.5px solid #e2e8f0; border-radius:8px; font-size:0.9rem; font-family:inherit; transition:border-color 0.2s; outline:none; }
    .inp:focus { border-color:#3b82f6; box-shadow:0 0 0 3px rgba(59,130,246,0.12); }
    .label { display:block; font-weight:600; font-size:0.82rem; color:#374151; margin-bottom:6px; text-transform:uppercase; letter-spacing:0.05em; }
    /* stat card click cursor */
    .stat[onclick] { cursor:pointer; transition:transform 0.15s; }
    .stat[onclick]:hover { transform:translateY(-2px); }

    @media print {
      nav, .nav, .tabs, #tabs, .no-print, button { display: none !important; }
      body, main { background: #fff !important; margin: 0 !important; padding: 0 !important; }
      .coord-cert-container { max-width: 100% !important; margin: 0 !important; padding: 0 !important; }
      #printCertArea { box-shadow: none !important; border: 6px double #d4af37 !important; page-break-inside: avoid; }
    }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="/" class="brand">
      <div class="brand-logo">P</div>
      <div class="brand-text">
        <b>PESC Council</b>
        <span>Coordinator Panel</span>
      </div>
    </a>
    <div class="nav-links" style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
      <span id="who" style="font-weight:700; color:#fde047; font-size:0.86rem; background:rgba(212,175,55,0.15); border:1px solid rgba(212,175,55,0.3); padding:4px 10px; border-radius:6px;"></span>
      <a href="/" target="_blank" style="color:#cbd5e1; font-size:0.85rem; font-weight:600; text-decoration:none; display:inline-flex; align-items:center; gap:4px;">🌐 Council Home</a>
      <button type="button" id="btnCoordLogout" class="btn sm danger" style="background:#dc2626; color:#ffffff; font-weight:700; border:none; border-radius:8px; padding:7px 16px; font-size:0.85rem; cursor:pointer; display:inline-flex; align-items:center; gap:6px; box-shadow:0 2px 8px rgba(220,38,38,0.35); transition:all 0.2s;" title="Logout from Coordinator Panel">
        🚪 Logout
      </button>
      <a href="#" id="out" style="display:none;" aria-hidden="true">Sign Out</a>
    </div>
  </nav>

  <main>
    <div class="tabs" id="tabs"></div>
    <div id="view" style="min-height:200px; padding:4px 0;">Loading coordinator workspace…</div>
  </main>

  <script src="/assets/js/official_templates.js"></script>
  <script src="/assets/js/app.js"></script>
  <script src="/assets/js/coordinator.js"></script>
</body>
</html>
